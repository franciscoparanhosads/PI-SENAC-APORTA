[pytest]
# Permite que os testes façam "import main", "import auth" etc., como o próprio back-end faz.
pythonpath = .
testpaths = tests
addopts = -v
filterwarnings =
    # aviso interno da biblioteca starlette (não é do nosso código)
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
