<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="./assets/logo.svg" type="image/x-icon">
<title>Aporta — Simulador de independência financeira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
<link rel="stylesheet" href="./css/estilo.css?v=0.2.1">
<link rel="stylesheet" href="./css/simulador.css?v=0.2.1">
<script src="js/chart.umd.min.js?v=0.2.1"></script>

</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="brand"><div class="brand-dot"></div><span class="disp">Aporta</span></div>
    <nav class="nav-links">
      <a href="painel.html">Painel</a>
      <a href="cadastro.html">Ativos</a>
      <a href="simulador.html" class="active">Simulador</a>
    </nav>
  </div>
  <div class="user-area">
    <span class="avatar" id="avatar" title="Sua conta">--</span>
    <button class="btn-sair" id="logout-btn" type="button">Sair</button>
  </div>
</div>

<div class="page-content">
  <div class="page-title-block">
    <h1 class="disp">Simulador de independência financeira</h1>
    <p>Ajuste o aporte mensal e a taxa esperada para ver quando você chega lá.</p>
  </div>

  <div class="sim-grid">
    <form id="sim-form" class="card sim-form">
      <label>
        Patrimônio atual (R$)
        <input type="number" id="current_amount" min="0" step="0.01" required>
      </label>
      <label>
        Aporte mensal (R$)
        <input type="number" id="monthly_contribution" min="0" step="0.01" required>
      </label>
      <label>
        Taxa de retorno esperada ao ano (%)
        <input type="number" id="annual_return_rate" min="0.1" max="100" step="0.1" value="9.5" required>
      </label>
      <label>
        Meta de patrimônio (R$)
        <input type="number" id="goal_amount" min="1" step="0.01" required>
      </label>
      <div class="error-msg" id="sim-error"></div>
      <button type="submit" class="btn-primary" id="sim-btn">Calcular projeção</button>
    </form>

    <div class="sim-resultado">
      <div class="card-dark resultado-topo" id="resultado-card">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span style="font-size:13px; color: var(--dark-text-muted);">Você atinge sua meta em</span>
          <span class="disp" id="resultado-tempo" style="font-size:30px;">—</span>
        </div>
        <div class="divisor-vertical"></div>
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span style="font-size:13px; color: var(--dark-text-muted);">Meta</span>
          <span id="resultado-meta" style="font-size:17px; font-weight:700;">—</span>
        </div>
      </div>

      <div class="card">
        <span style="font-size:14px; font-weight:700;">Evolução projetada do patrimônio</span>
        <div id="grafico-linha-wrap" style="margin-top:12px;">
          <canvas id="grafico-linha"></canvas>
        </div>
        <p id="aviso-nao-alcancavel" class="error-msg" style="margin-top:8px;"></p>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js?v=0.2.1"></script>
<script src="js/utils.js?v=0.2.1"></script>
<script src="js/simulador.js?v=0.2.1"></script>
</body>
</html>
